<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAM Planner — Viewer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f9;
  --surface:#ffffff;
  --surface-2:#f6fafe;
  --surface-hover:#eaf2fb;
  --border:#dde6f0;
  --border-strong:#c2d2e2;
  --text:#161a1d;
  --muted:#5b6b78;
  --faint:#8fa0ad;
  --brand-1:#0a355b;
  --brand-2:#1c73c4;
  --brand-accent:#03c4c9;
  --prologis:#0e6b5a;
  --prologis-soft:#d7ede8;
  --feature:#14b8ab;
  --feature-soft:#d7f3f0;
  --bugfix:#f0a336;
  --bugfix-soft:#fbe8cf;
  --potential:#8b6ef0;
  --potential-soft:#e7e1fb;
  --free:#1a9a56;
  --warn:#d1830b;
  --over:#d1362f;
  --r-sm:7px;--r-md:11px;--r-lg:16px;
  --shadow-sm:0 1px 2px rgba(10,53,91,.06),0 1px 1px rgba(10,53,91,.05);
  --shadow-md:0 6px 20px rgba(10,53,91,.10);
  --shadow-lg:0 16px 40px rgba(10,53,91,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
::selection{background:var(--feature-soft);}
.mono{font-family:'JetBrains Mono',monospace;}

header{background:linear-gradient(100deg,var(--brand-1),var(--brand-2));padding:20px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow-md);position:relative;z-index:2;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-mark{width:42px;height:42px;border-radius:var(--r-md);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:#fff;letter-spacing:.5px;flex-shrink:0;}
.hl h1{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.2px;}
.hl p{font-size:11.5px;color:rgba(255,255,255,.58);font-family:'JetBrains Mono',monospace;margin-top:3px;}
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.li{display:flex;align-items:center;gap:7px;font-size:11.5px;color:rgba(255,255,255,.85);font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:5px 10px 5px 8px;border-radius:20px;}
.ld{width:9px;height:9px;border-radius:3px;flex-shrink:0;}

.stats{display:flex;gap:12px;padding:18px 32px;background:var(--surface);border-bottom:1px solid var(--border);}
.sc{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:13px 20px;position:relative;transition:box-shadow .15s,border-color .15s;}
.sc:hover{box-shadow:var(--shadow-sm);border-color:var(--border-strong);}
.sl{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.6px;font-weight:600;}
.sv{font-size:22px;font-weight:800;margin-top:4px;font-family:'JetBrains Mono',monospace;letter-spacing:-.3px;}

.toolbar{padding:12px 32px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{padding:7px 14px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn svg{width:13px;height:13px;flex-shrink:0;}
.btn-green{background:var(--prologis);color:#fff;}
.btn-green:hover{background:#0b5a4c;}
.btn-navy{background:var(--brand-1);color:#fff;}
.btn-navy:hover{background:#141833;}
.btn-ghost{background:var(--surface-2);color:var(--muted);border-color:var(--border);}
.btn-ghost:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong);}
.tsep{width:1px;height:22px;background:var(--border);display:inline-block;margin:0 4px;}
.fb{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:500;cursor:pointer;transition:all .15s;}
.fb.active,.fb:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong);}
.fb[data-q="Q1"].active{border-color:#8b6ef0;color:#7c4fe0;background:#f1ecfd;}
.fb[data-q="Q2"].active{border-color:#3a7bd5;color:#2f66b8;background:#eaf2fd;}
.fb[data-q="Q3"].active{border-color:#1a9a56;color:#137a44;background:#e7f8ee;}
.fb[data-q="Q4"].active{border-color:#d1830b;color:#a86803;background:#fdf1de;}
.fb[data-q="Q1_27"].active{border-color:#8b6ef0;color:#7c4fe0;background:#f1ecfd;}
.fb[data-q="Q2_27"].active{border-color:#3a7bd5;color:#2f66b8;background:#eaf2fd;}
.fb[data-q="Q3_27"].active{border-color:#1a9a56;color:#137a44;background:#e7f8ee;}
.fb[data-q="Q4_27"].active{border-color:#d1830b;color:#a86803;background:#fdf1de;}

.filt-banner{display:flex;align-items:center;gap:6px;padding:0 0 14px;font-size:11.5px;color:var(--prologis);font-family:'JetBrains Mono',monospace;font-weight:600;}
.filt-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--prologis);}
.ok{color:var(--free);}.wa{color:var(--warn);}.ov{color:var(--over);}
.qdot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}
.q1d{background:#8b6ef0;}.q2d{background:#3a7bd5;}.q3d{background:#1a9a56;}.q4d{background:#d1830b;}
.dim{opacity:.42;}

.gantt-wrap{padding:20px 32px;overflow-x:auto;}
.gantt{min-width:1500px;position:relative;}
.months{display:flex;margin-left:132px;margin-bottom:8px;}
.ml{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--faint);text-align:center;border-left:1px dashed var(--border-strong);padding:2px 4px 6px;white-space:nowrap;overflow:hidden;font-weight:600;letter-spacing:.3px;}
.gr{display:flex;align-items:center;margin-bottom:6px;}
.gl{width:132px;flex-shrink:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;padding-right:10px;white-space:nowrap;overflow:visible;display:flex;align-items:center;gap:6px;color:var(--text);}
.gbadge{font-size:8.5px;padding:1px 5px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-weight:700;white-space:nowrap;}
.gbadge.now{background:var(--prologis-soft);color:var(--prologis);}
.gbadge.done{background:var(--surface-2);color:var(--faint);border:1px solid var(--border);}
.gt{flex:1;height:40px;position:relative;cursor:pointer;}
.gnode{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s;}
.gt:hover .gnode{transform:translateY(-50%) scale(1.04);}
.gchip{display:flex;align-items:stretch;height:22px;width:100%;min-width:20px;border-radius:11px;overflow:hidden;box-shadow:0 1px 3px rgba(10,53,91,.18);border:1.5px solid #fff;}
.gseg{height:100%;}
.gseg.free{background:var(--surface-2);}
.gchip-val{font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:800;white-space:nowrap;}
.dim .gnode{opacity:.45;}
.cur-row .gchip{box-shadow:0 0 0 2px #f0c040,0 1px 3px rgba(10,53,91,.18);}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--over);z-index:20;pointer-events:none;}
.today-label{position:absolute;top:0;left:3px;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--over);font-weight:700;white-space:nowrap;}

.panel{display:none;margin:10px 32px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-lg);}
.panel.open{display:block;}
.ph{background:linear-gradient(100deg,var(--brand-1),var(--brand-2));padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
.ph h3{font-size:14px;font-weight:700;color:#fff;font-family:'JetBrains Mono',monospace;letter-spacing:.3px;}
.pm{font-size:11.5px;color:rgba(255,255,255,.62);font-family:'JetBrains Mono',monospace;}
.pc{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.8);cursor:pointer;font-size:15px;line-height:1;padding:4px 9px;border-radius:7px;transition:all .15s;}
.pc:hover{color:#fff;background:rgba(255,255,255,.18);}
.pst{display:flex;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface-2);}
.psc{flex:1;min-width:90px;padding:12px 16px;border-right:1px solid var(--border);}
.psc:last-child{border-right:none;}
.psl{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.psv{font-size:18px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:3px;letter-spacing:-.2px;}
.ptasks{padding:14px 20px;display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto;}
.pt{display:grid;grid-template-columns:9px 1fr 112px 92px 60px;gap:10px;align-items:center;padding:9px 12px;background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-sm);font-size:12.5px;transition:border-color .15s;}
.pt:hover{border-color:var(--border);}
.ptd{width:8px;height:8px;border-radius:2px;}
.ptn{font-family:'Inter',sans-serif;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;}
.ptc{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ptj{font-family:'JetBrains Mono',monospace;font-size:11px;}
.ptj a{color:#2f66b8;text-decoration:none;}
.ptj a:hover{text-decoration:underline;}
.pth{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;text-align:right;}
.pe{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;padding:10px 0;}
.upd{font-size:11px;color:var(--faint);font-family:'JetBrains Mono',monospace;padding:10px 32px 20px;}
.empty-msg{text-align:center;padding:56px 32px;color:var(--muted);}
.empty-msg h2{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text);}
.empty-msg p{font-size:13px;font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>
<header>
  <div class="brand">

  </div>
  <div class="legend">

    <div class="li"><div class="ld" style="background:var(--bugfix)"></div>Bugfixes</div>
    <div class="li"><div class="ld" style="background:var(--potential)"></div>Potential</div>

  <button class="btn btn-ghost" id="expHtmlBtn" onclick="expHtml()" style="display:none"><svg viewBox="0 0 16 16" fill="none"><path d="M8 3v8M8 11l-3.5-3.5M8 11l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12.5v.5a1 1 0 001 1h8a1 1 0 001-1v-.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Export HTML (Confluence)</button>
  <span class="tsep"></span>
  <button class="fb active" data-q="ALL" onclick="setF('ALL')">All</button>
  <button class="fb" data-q="Q1" onclick="setF('Q1')">Q1 2026</button>
  <button class="fb" data-q="Q2" onclick="setF('Q2')">Q2 2026</button>
  <button class="fb" data-q="Q3" onclick="setF('Q3')">Q3 2026</button>
  <button class="fb" data-q="Q4" onclick="setF('Q4')">Q4 2026</button>
  <button class="fb" data-q="Q1_27" onclick="setF('Q1_27')">Q1 2027</button>
  <button class="fb" data-q="Q2_27" onclick="setF('Q2_27')">Q2 2027</button>
  <button class="fb" data-q="Q3_27" onclick="setF('Q3_27')">Q3 2027</button>
  <button class="fb" data-q="Q4_27" onclick="setF('Q4_27')">Q4 2027</button>
  <input type="file" id="impFile" accept=".json" style="display:none" onchange="impJson(event)">
</div>
<div class="gantt-wrap"><div class="gantt" id="gantt"></div></div>
<div class="panel" id="panel">
  <div class="ph">
    <h3 id="ptitle">Sprint</h3>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="pm" id="pmeta"></span>
      <button class="pc" onclick="closePanel()">&#215;</button>
    </div>
  </div>
  <div class="pst" id="pstats"></div>
  <div class="ptasks" id="ptasks"></div>
</div>
<div class="upd" id="upd"></div>

function getCap(id){return ov[id]&&ov[id].cap!=null?ov[id].cap:cap;}

function stats(id){
  var t=tasks[id]||[],c=getCap(id),p=getProl(id);

}

  });
  if(!filtered.length){el.innerHTML='<div style="padding:32px;text-align:center;color:var(--muted);font-family:JetBrains Mono,monospace">No sprints.</div>';return;}
  var minD=new Date(filtered[0].s),maxD=new Date(filtered[filtered.length-1].e);
  var totalMs=maxD-minD;
  var months=[],d=new Date(minD.getFullYear(),minD.getMonth(),1);
  while(d<=maxD){months.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,1);}
  var mHtml=months.map(function(m){
    var mp=Math.max(0,(m-minD)/totalMs*100);
    var me=new Date(m.getFullYear(),m.getMonth()+1,1);
    var mw=Math.min(100,(me-minD)/totalMs*100)-mp;
    return '<div class="ml" style="width:'+mw.toFixed(2)+'%">'+m.toLocaleDateString('en-GB',{month:'short',year:'2-digit'})+'</div>';
  }).join('');
  var today=new Date();
  var qdMap={'Q1':'q1d','Q2':'q2d','Q3':'q3d','Q4':'q4d','Q1_27':'q1d','Q2_27':'q2d','Q3_27':'q3d','Q4_27':'q4d'};
  var statusWord={'ov':'OVERLOADED','wa':'LOW FREE','ok':'OK'};
  var rows=filtered.map(function(s){
    var st=stats(s.id),past=isPast(s),cur=isCur(s);
    var c=st.cap,sS=new Date(s.s),sE=new Date(s.e);
    // Clamp cumulatively so an overloaded sprint's chip always tops out at a
    // fully-colored pill instead of segments overrunning it.
    var cp=Math.max(0,Math.min(1,st.cH/c));
    var fp=Math.max(0,Math.min(1-cp,st.fH/c));
    var bp=Math.max(0,Math.min(1-cp-fp,st.bH/c));
    var pop=Math.max(0,Math.min(1-cp-fp-bp,(st.poH||0)/c));
    var freeP=Math.max(0,1-cp-fp-bp-pop);
    var segs=[{v:cp,color:'var(--prologis)'},{v:fp,color:'var(--feature)'},{v:bp,color:'var(--bugfix)'},{v:pop,color:'var(--potential)'}];
    var segHtml=segs.map(function(sg){
      return sg.v>0.003?'<div class="gseg" style="width:'+(sg.v*100).toFixed(1)+'%;background:'+sg.color+'"></div>':'';
    }).join('')+(freeP>0.003?'<div class="gseg free" style="width:'+(freeP*100).toFixed(1)+'%"></div>':'');
    var fc=st.free<0?'ov':st.free<20?'wa':'ok';
    var ft=st.free<0?(Math.abs(st.free)+'h!'):(st.free+'h');
    var qdc=qdMap[s.q]||'q1d';
    var label=s.id.replace('2026_','').replace('2027_','');
    var badge=cur?'<span class="gbadge now">NOW</span>':(past?'<span class="gbadge done">DONE</span>':'');
    var leftPct=((sS-minD)/totalMs*100).toFixed(2);
    var widPct=((sE-sS)/totalMs*100).toFixed(2);
    var tip=fd(s.s)+' - '+fd(s.e)+' — '+statusWord[fc]+' ('+ft+' free)';
    return '<div class="gr'+(past?' dim':'')+(cur?' cur-row':'')+'">'+
      '<div class="gl"><div class="qdot '+qdc+'"></div>'+label+badge+'</div>'+
      '<div class="gt" onclick="openPanel(\''+s.id+'\')" title="'+tip+'">'+
        '<div class="gnode" style="left:'+leftPct+'%;width:'+widPct+'%">'+
          '<div class="gchip-val '+fc+'">'+ft+'</div>'+
          '<div class="gchip">'+segHtml+'</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  var todayPct=((today-minD)/totalMs*100);
  var todayLine='';
  if(todayPct>=0&&todayPct<=100){
    todayLine='<div class="gr" style="position:absolute;top:0;bottom:0;left:0;right:0;pointer-events:none;margin:0;">'+
      '<div style="width:132px;flex-shrink:0"></div>'+
      '<div style="flex:1;position:relative;height:100%">'+
        '<div class="today-line" style="left:'+todayPct.toFixed(2)+'%;top:-8px;">'+
          '<div class="today-label">TODAY</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }
  var visBanner=hasVis?'<div class="filt-banner"><span class="dot"></span>Showing '+filtered.length+' selected sprint'+(filtered.length!==1?'s':'')+' (Viewer scope)</div>':'';
  el.innerHTML=visBanner+'<div class="months">'+mHtml+'</div>'+
    '<div style="position:relative">'+todayLine+rows+'</div>';
}
function openPanel(sid){
  var s=SP.find(function(x){return x.id===sid;}),st=stats(sid),ts=tasks[sid]||[];
  document.getElementById('ptitle').textContent=sid.replace('2026_','').replace('2027_','');
  document.getElementById('pmeta').textContent=fd(s.s)+' - '+fd(s.e);
  document.getElementById('pstats').innerHTML=
    '<div class="psc"><div class="psl">Prologis</div><div class="psv" style="color:var(--prologis)">'+st.cH+'h</div></div>'+
    '<div class="psc"><div class="psl">Features</div><div class="psv" style="color:var(--feature)">'+st.fH+'h</div></div>'+
    '<div class="psc"><div class="psl">Bugfixes</div><div class="psv" style="color:var(--bugfix)">'+st.bH+'h</div></div>'+
    '<div class="psc"><div class="psl">Potential</div><div class="psv" style="color:var(--potential)">'+(st.poH||0)+'h</div></div>'+
    '<div class="psc"><div class="psl">Free</div><div class="psv" style="color:'+(st.free<0?'var(--over)':st.free<20?'var(--warn)':'var(--free)')+'">'+st.free+'h</div></div>'+
    '<div class="psc"><div class="psl">Capacity</div><div class="psv">'+st.cap+'h</div></div>';
  var th=ts.length?ts.map(function(t){
    var jd=t.url?('<a href="'+t.url+'" target="_blank">'+(t.jira||'link')+'</a>'):(t.jira||'&mdash;');
    return '<div class="pt">'+
      '<div class="ptd" style="background:'+tc(t.type)+'"></div>'+
      '<div class="ptn" title="'+t.name+'">'+t.name+'</div>'+
      '<div class="ptc">'+(t.client||'&mdash;')+'</div>'+
      '<div class="ptj">'+jd+'</div>'+
      '<div class="pth">'+t.h+'h</div>'+
    '</div>';
  }).join(''):'<div class="pe">No tasks logged for this sprint.</div>';
  document.getElementById('ptasks').innerHTML=th;
  document.getElementById('panel').classList.add('open');
  document.getElementById('panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closePanel(){document.getElementById('panel').classList.remove('open');}
function impTrig(){document.getElementById('impFile').click();}
function loadData(d){
  tasks=d.tasks||{};ov=d.ov||{};cap=d.cap||160;prol=d.prol||50;vis=d.vis||{};
  rawData=d;loaded=true;
  document.getElementById('expBtn').style.display='';
  document.getElementById('expHtmlBtn').style.display='';
  if(d.exportedAt)document.getElementById('upd').textContent='Last updated: '+new Date(d.exportedAt).toLocaleString('en-GB');
  renderStats();renderGantt();
}
function impJson(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{loadData(JSON.parse(ev.target.result));}catch(er){alert('Invalid JSON.');}
  };
  r.readAsText(f);
}
function expJson(){
  if(!rawData)return;
  var b=new Blob([JSON.stringify(rawData,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tam_data.json';a.click();
}
function expHtml(){
  if(!rawData)return;
  var src=document.documentElement.outerHTML;
  var dataScript='<script>window._PRELOAD='+JSON.stringify(rawData)+';<\/script>';
  var injected=src.replace('</head>',dataScript+'</head>');
  injected=injected.replace('renderStats();renderGantt();','renderStats();renderGantt();if(window._PRELOAD){loadData(window._PRELOAD);}');
  var b=new Blob([injected],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tam_planner_confluence.html';a.click();
}
renderStats();renderGantt();
</script>
